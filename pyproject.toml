[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskfm"
version = "1.0.0"
description = "External-memory substring index (disk FM-index) over arbitrary Unicode text"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
diskfm = "diskfm.cli:main"
diskfm-sim = "diskfm.simcli:main"

[tool.setuptools]
packages = ["diskfm"]
